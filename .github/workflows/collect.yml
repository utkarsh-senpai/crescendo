# Daily unattended collector. Requires repo secrets:
#   YOUTUBE_API_KEY, DATABASE_URL (Neon Postgres connection string).
# `doctor` runs first so a misconfigured run fails fast instead of collecting nothing.
# v1.3: seed-genres (idempotent) ensures the curated Pop/EDM/Bollywood top-artist pool is tracked,
# then collect snapshots it. Append-only — an artist that later drops out of a top-N view keeps its
# history. Cost is ~1-2 units/day (channels.list batches 50 ids per unit).
#
# ToS NOTE (YouTube Developer Policies §III.E.2/E.4): public API stats obtained without channel-owner
# OAuth ("Non-Authorized Data") must not be STORED >30 days, and cross-channel aggregation must not be
# publicly exposed. This raw history is kept PRIVATE (Neon) for personal ML/analytics only — never
# redistributed. If you ever publish a dashboard/API, expose only DERIVED metrics refreshed to
# current, or pursue the audited-developer quota-extension path first.
name: collect

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: collect          # never overlap two collect passes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync
      - name: Preflight (config, DB, API key, quota)
        run: uv run crescendo doctor
      - name: Ensure the genre pool is tracked (idempotent)
        run: uv run crescendo seed-genres
      - name: Collect one snapshot pass
        run: uv run crescendo collect
