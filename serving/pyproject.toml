[project]
name = "crescendo-serving"
version = "0.3.0"
description = "Crescendo — FastAPI prediction service (the predict() seam over HTTP; L3 §11)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "utkarsh-senpai" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # The ML core — CrescendoModel.predict is the seam this service wraps (L2 §5).
    # Path dependency: serving/ and ml/ are sibling dirs in the monorepo.
    "crescendo",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",   # FastAPI TestClient transport
    "ruff>=0.5",
]

[project.scripts]
crescendo-serve = "crescendo_serving.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crescendo_serving"]

[tool.uv.sources]
crescendo = { path = "../ml", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
