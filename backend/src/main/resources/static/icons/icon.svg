<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Crescendo">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2E8"/>
      <stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0B0E14"/>
  <g fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- crescendo hairpin: apex at left, swelling open to the right -->
    <path d="M96 256 L250 168"/>
    <path d="M96 256 L250 344"/>
  </g>
  <!-- swell resolves into 4 rising equalizer bars -->
  <g fill="url(#g)">
    <rect x="286" y="300" width="34" height="60"  rx="17"/>
    <rect x="340" y="248" width="34" height="112" rx="17"/>
    <rect x="394" y="196" width="34" height="164" rx="17"/>
    <rect x="448" y="150" width="34" height="210" rx="17"/>
  </g>
</svg>
