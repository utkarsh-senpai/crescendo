[project]
name = "crescendo"
version = "0.1.0"
description = "Crescendo — leakage-safe emerging-artist breakout prediction (MVP modeling spike)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "utkarsh-senpai" }]
dependencies = [
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "joblib>=1.4",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "requests>=2.32",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
crescendo = "crescendo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crescendo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
